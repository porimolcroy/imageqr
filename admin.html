<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>অ্যাডমিন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
.login{max-width:400px;margin:40px auto;padding:28px}
.login h2{margin:0 0 4px;color:var(--brand-dark)}
.login p{margin:0 0 18px;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat small{color:var(--muted);font-size:13px}
.stat b{display:block;font-size:28px;color:var(--brand-dark);line-height:1.2}
.stat.g b{color:var(--ok)}.stat.r b{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px;margin-bottom:16px}
.tools .input{width:auto;flex:1 1 200px;padding:9px 12px;font-size:14px}
.tools .sp{flex:1 1 20px}
.tw{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{background:#f8fafc;color:#475569;text-align:left;padding:11px 12px;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#fafcff}
.pw{font-family:Consolas,monospace}
.eyeb{border:0;background:none;cursor:pointer;font-size:15px}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.st.a{background:var(--ok-bg);color:var(--ok)}.st.b{background:var(--bad-bg);color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:28px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90vw}
#toast.on{opacity:1}#toast.bad{background:var(--bad)}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <div class="brand"><span class="logo-mark" data-logo></span><span data-brand></span> <span class="badge">অ্যাডমিন</span></div>
    <div class="app-user">
      <a class="btn ghost sm" href="index.html">সাইট</a>
      <button class="btn ghost sm hide" id="lo" onclick="adminOut()">লগআউট</button>
    </div>
  </div>
</header>

<main class="wrap">

  <section id="lg" class="login card">
    <h2>অ্যাডমিন প্রবেশ</h2>
    <p>ইউজার ম্যানেজ করতে অ্যাডমিন পাসওয়ার্ড দিন।</p>
    <div class="field"><input class="input" id="ap" type="password" placeholder="অ্যাডমিন পাসওয়ার্ড" autocomplete="current-password"></div>
    <button class="btn" id="apGo" style="width:100%" onclick="adm()">প্রবেশ</button>
    <div id="e" role="alert"></div>
  </section>

  <section id="pn" class="hide">
    <div class="stats">
      <div class="stat card"><small>মোট ইউজার</small><b id="sT">0</b></div>
      <div class="stat card g"><small>সক্রিয় (Active)</small><b id="sA">0</b></div>
      <div class="stat card r"><small>ব্লক করা</small><b id="sB">0</b></div>
    </div>

    <div class="tools card">
      <input class="input" id="q" type="search" placeholder="🔍 ইমেইল বা User ID দিয়ে খুঁজুন" oninput="draw()">
      <span class="sp"></span>
      <input class="input" id="be" type="email" placeholder="email@example.com">
      <button class="btn red sm" onclick="act('block',$('be').value)">ব্লক</button>
      <button class="btn green sm" onclick="act('unblock',$('be').value)">আনব্লক</button>
      <button class="btn ghost sm" onclick="refresh()">↻ রিফ্রেশ</button>
    </div>

    <div class="tw card">
      <table>
        <thead><tr><th>User ID</th><th>Email</th><th>Password</th><th>Status</th><th>Signup</th><th>Last Login</th><th></th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="toast"></div>

<script src="config.js"></script>
<script>
fillBrand('অ্যাডমিন');
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let PW = '', USERS = [], tt;

function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg; t.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(tt); tt = setTimeout(() => t.className = '', 2600);
}

async function adm() {
  PW = $('ap').value;
  if (!PW) { $('e').className = 'alert err'; $('e').textContent = 'পাসওয়ার্ড দিন।'; return; }
  $('apGo').disabled = true; $('apGo').innerHTML = '<span class="spin"></span> অপেক্ষা করুন...';
  const d = await api({ action: 'admin_list', admin_password: PW });
  $('apGo').disabled = false; $('apGo').textContent = 'প্রবেশ';
  if (d.ok) {
    USERS = d.users; $('e').className = ''; $('e').textContent = '';
    $('lg').classList.add('hide'); $('pn').classList.remove('hide'); $('lo').classList.remove('hide');
    draw();
  } else { $('e').className = 'alert err'; $('e').textContent = d.error || 'সমস্যা হয়েছে'; }
}
function adminOut() {
  PW = ''; USERS = []; $('ap').value = '';
  $('pn').classList.add('hide'); $('lo').classList.add('hide'); $('lg').classList.remove('hide');
}

function draw() {
  const blockedN = USERS.filter(u => String(u.status).toLowerCase() === 'blocked').length;
  const pendN = USERS.filter(u => String(u.status).toLowerCase() === 'pending').length;
  $('sT').textContent = USERS.length; $('sB').textContent = blockedN; $('sA').textContent = USERS.length - blockedN - pendN;

  const q = $('q').value.trim().toLowerCase();
  const list = USERS.filter(u => !q || String(u.email).toLowerCase().includes(q) || String(u.id).toLowerCase().includes(q));
  if (!list.length) { $('tb').innerHTML = '<tr><td colspan="7" class="empty">কোনো ইউজার পাওয়া যায়নি</td></tr>'; return; }

  $('tb').innerHTML = list.map(u => {
    const b = String(u.status).toLowerCase() === 'blocked';
    const p = String(u.status).toLowerCase() === 'pending';
    return `<tr>
      <td>${esc(u.id)}</td>
      <td>${esc(u.email)}</td>
      <td><span class="pw" data-p="${esc(u.password)}">••••••</span> <button class="eyeb" onclick="tg(this)" title="দেখুন/লুকান">👁</button></td>
      <td><span class="st ${b ? 'b' : 'a'}">${b ? 'Blocked' : p ? 'Pending' : 'Active'}</span></td>
      <td>${esc(u.signup)}</td><td>${esc(u.last)}</td>
      <td><div class="acts">
        <button class="btn sm ${b ? 'green' : 'red'}" data-e="${esc(u.email)}" data-a="${b ? 'unblock' : 'block'}" onclick="act(this.dataset.a,this.dataset.e)">${b ? 'আনব্লক' : 'ব্লক'}</button>
        <button class="btn sm ghost" data-e="${esc(u.email)}" onclick="setPw(this.dataset.e)">পাসওয়ার্ড রিসেট</button>
      </div></td></tr>`;
  }).join('');
}
function tg(el) { const s = el.previousElementSibling; s.textContent = s.textContent === '••••••' ? s.dataset.p : '••••••'; }

async function refresh() {
  const d = await api({ action: 'admin_list', admin_password: PW });
  if (d.ok) { USERS = d.users; draw(); } else toast(d.error || 'রিফ্রেশ হয়নি', true);
}
async function setPw(email) {
  const p = prompt(email + ' এর নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর):');
  if (!p) return;
  const r = await api({ action: 'admin_set_password', admin_password: PW, email: email, new_password: p });
  if (!r.ok) { toast(r.error || 'হয়নি', true); return; }
  toast('পাসওয়ার্ড পরিবর্তন হয়েছে'); refresh();
}
async function act(a, email) {
  email = String(email || '').trim();
  if (!email) { toast('ইমেইল দিন', true); return; }
  const r = await api({ action: 'admin_' + a, admin_password: PW, email: email });
  if (!r.ok) { toast(r.error || 'হয়নি', true); return; }
  toast(a === 'block' ? 'ব্লক করা হয়েছে' : 'আনব্লক করা হয়েছে'); $('be').value = ''; refresh();
}
$('ap').addEventListener('keydown', e => { if (e.key === 'Enter') adm(); });
</script>
</body>
</html>
